AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore Workshop - Aurora Serverless v2 (PostgreSQL) 数仓。
  自建 VPC + 两个私有子网：私网访问统一由挂进本 VPC 的 Lambda 承担——
  Part 1 的 Agent 走 lambda.invoke -> 写库 Lambda(VPC) -> pg8000 直连集群，
  Part 2 走 Gateway -> 数据查询 Lambda(VPC) -> 集群，两侧的托管服务都不需要
  VPC egress。之所以不用 RDS Data API：中国区没有该服务，本 workshop 后续要
  整体移植过去，先用等效架构在海外区验证。
  Secrets Manager 接口端点归本栈（VPC 拥有者），Part 1/Part 2 的 VPC 内
  Lambda 共用；同一 VPC 同一服务的 Private DNS 端点只能有一个。

Parameters:
  DatabaseName:
    Type: String
    Default: product_hunting
  MinCapacityACU:
    Type: Number
    Default: 0
    Description: 0 = 空闲自动暂停（冷恢复约 15 秒~1 分钟，写库 Lambda 已做重试）
  MaxCapacityACU:
    Type: Number
    Default: 2
  WriterFunctionName:
    Type: String
    Default: agentcore-workshop-writer
    Description: 写库 Lambda 的函数名（函数本体由 deploy.sh 打包创建，本栈只建角色与授权）

Resources:
  # ---- 网络：私有 VPC（无 IGW/NAT；两个部分的 Lambda 直接挂进来） ----
  WorkshopVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: agentcore-workshop-vpc }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: agentcore-workshop-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: agentcore-workshop-private-b }]

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora subnets (workshop)
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # 集群安全组：仅允许持有 LambdaClientSecurityGroup 的客户端访问 5432
  #（VPC 内 Lambda 挂 client SG 即可直连；Data API 不走安全组）
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster access (workshop)
      VpcId: !Ref WorkshopVpc

  # Part 1 写库 Lambda 与 Part 2 analytics Lambda 都挂这个 SG（凭它访问集群 5432
  # 与 Secrets 端点 443）。GroupDescription 改一个字都会触发安全组 replacement，
  # 而旧 SG 还绑在已部署 Lambda 的 ENI 上（删不掉，且授权会指向新 SG 导致断连），
  # 所以描述文字保持原样，说明只写在注释里。
  LambdaClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Client SG for in-VPC Lambda (part2)
      VpcId: !Ref WorkshopVpc

  DbIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaClientSecurityGroup

  # ---- Secrets Manager 接口端点：VPC 无 IGW/NAT，VPC 内 Lambda 取数据库
  #      凭证只能走这里。端点随 VPC 归属本栈，Part 2 的 analytics Lambda 共用
  #      （同一 VPC 对同一服务只允许一个 Private DNS 端点） ----
  SecretsEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Secrets Manager VPC endpoint access (workshop)
      VpcId: !Ref WorkshopVpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref LambdaClientSecurityGroup

  SecretsManagerVpcEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref WorkshopVpc
      ServiceName: !Sub com.amazonaws.${AWS::Region}.secretsmanager
      VpcEndpointType: Interface
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      SecurityGroupIds: [!Ref SecretsEndpointSecurityGroup]
      PrivateDnsEnabled: true

  # ---- Aurora Serverless v2（PostgreSQL）+ Data API ----
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "17.10"
      DatabaseName: !Ref DatabaseName
      MasterUsername: postgres
      ManageMasterUserPassword: true          # 密码托管在 Secrets Manager
      EnableHttpEndpoint: true                # RDS Data API：Part 2 与 CLI 查数仓仍在用
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacityACU
        MaxCapacity: !Ref MaxCapacityACU
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 1

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  # ---- 写库 Lambda 的执行角色：VPC ENI 管理 + 读数据库 Secret ----
  #（函数本体由 deploy.sh 打包创建，与 Part 2 的 analytics Lambda 同一模式）
  WriterLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: agentcore-workshop-writer-lambda-role
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: read-db-secret
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [secretsmanager:GetSecretValue]
                Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

  # ---- Part 1 Runtime 执行角色写数仓所需的全部权限：调写库 Lambda 即可 ----
  # Part 1 的 Agent 自此不再接触数据库凭证，也不需要 rds-data 权限。
  AgentWriterInvokePolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: agentcore-workshop-agent-writer-invoke
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: InvokeWriterLambda
            Effect: Allow
            Action: [lambda:InvokeFunction]
            Resource: !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:${WriterFunctionName}

  # ---- RDS Data API 访问策略：现在只服务 Part 2 ----
  # Part 2 的 Runtime（会话历史落库）与 tasks-api / runner 两个 Lambda 都挂它
  #（part2-tasks.yaml 按 ARN 引用）。Part 1 已改走写库 Lambda，不再挂这份。
  # ManagedPolicyName 不可改：改名会触发 replacement，而删除仍附着在
  # Part 2 各角色上的旧 policy 会失败。Part 2 迁出 Data API 后本策略可删。
  AgentDataAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: agentcore-workshop-agent-data-access-aurora
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuroraDataApi
            Effect: Allow
            Action:
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:BeginTransaction
              - rds-data:CommitTransaction
              - rds-data:RollbackTransaction
            Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
          - Sid: ReadDbSecret
            Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

Outputs:
  ClusterArn:
    Value: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
  SecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
  DatabaseName:
    Value: !Ref DatabaseName
  # Part 1 Runtime 执行角色挂这份（调写库 Lambda）
  AgentWriterInvokePolicyArn:
    Value: !Ref AgentWriterInvokePolicy
  # Data API 访问策略：Part 2 的 Runtime 与两个任务管理 Lambda 挂这份
  AgentDataAccessPolicyArn:
    Value: !Ref AgentDataAccessPolicy
  WriterLambdaRoleArn:
    Value: !GetAtt WriterLambdaRole.Arn
  WriterFunctionName:
    Value: !Ref WriterFunctionName
  # 以下输出给两个部分的 VPC 内 Lambda 使用
  VpcId:
    Value: !Ref WorkshopVpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  LambdaClientSecurityGroupId:
    Value: !Ref LambdaClientSecurityGroup
  ClusterEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
