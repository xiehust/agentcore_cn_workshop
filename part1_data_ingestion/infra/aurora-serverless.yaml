AWSTemplateFormatVersion: "2010-09-09"
Description: >
  AgentCore Workshop - Aurora Serverless v2 (PostgreSQL) 数仓。
  自建 VPC + 两个私有子网：Part 1 的 Agent 通过 RDS Data API（HTTPS，
  无需入 VPC）读写；Part 2 计划把数据查询 Lambda 挂进本 VPC 直连集群，
  验证 Gateway -> Lambda(VPC) -> Aurora(同 VPC) 方案（不使用 Gateway
  VPC egress）。

Parameters:
  DatabaseName:
    Type: String
    Default: product_hunting
  MinCapacityACU:
    Type: Number
    Default: 0
    Description: 0 = 空闲自动暂停（冷恢复约 15 秒~1 分钟，入库工具已做重试）
  MaxCapacityACU:
    Type: Number
    Default: 2

Resources:
  # ---- 网络：私有 VPC（无 IGW/NAT；Part 2 的 Lambda 直接挂进来） ----
  WorkshopVpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: agentcore-workshop-vpc }]

  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{ Key: Name, Value: agentcore-workshop-private-a }]

  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref WorkshopVpc
      CidrBlock: 10.20.2.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{ Key: Name, Value: agentcore-workshop-private-b }]

  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Aurora subnets (workshop)
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  # 集群安全组：仅允许持有 LambdaClientSecurityGroup 的客户端访问 5432
  #（Part 2 的 VPC 内 Lambda 挂 client SG 即可直连；Data API 不走安全组）
  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Aurora cluster access (workshop)
      VpcId: !Ref WorkshopVpc

  LambdaClientSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Client SG for in-VPC Lambda (part2)
      VpcId: !Ref WorkshopVpc

  DbIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DbSecurityGroup
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      SourceSecurityGroupId: !Ref LambdaClientSecurityGroup

  # ---- Aurora Serverless v2（PostgreSQL）+ Data API ----
  AuroraCluster:
    Type: AWS::RDS::DBCluster
    DeletionPolicy: Delete
    Properties:
      Engine: aurora-postgresql
      EngineVersion: "17.10"
      DatabaseName: !Ref DatabaseName
      MasterUsername: postgres
      ManageMasterUserPassword: true          # 密码托管在 Secrets Manager
      EnableHttpEndpoint: true                # RDS Data API（Part 1 走这里）
      ServerlessV2ScalingConfiguration:
        MinCapacity: !Ref MinCapacityACU
        MaxCapacity: !Ref MaxCapacityACU
      DBSubnetGroupName: !Ref DbSubnetGroup
      VpcSecurityGroupIds: [!Ref DbSecurityGroup]
      StorageEncrypted: true
      BackupRetentionPeriod: 1

  AuroraInstance:
    Type: AWS::RDS::DBInstance
    Properties:
      DBClusterIdentifier: !Ref AuroraCluster
      Engine: aurora-postgresql
      DBInstanceClass: db.serverless
      PubliclyAccessible: false

  # ---- Agent（Runtime 执行角色）访问数仓所需的最小权限 ----
  AgentDataAccessPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: agentcore-workshop-agent-data-access-aurora
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: AuroraDataApi
            Effect: Allow
            Action:
              - rds-data:ExecuteStatement
              - rds-data:BatchExecuteStatement
              - rds-data:BeginTransaction
              - rds-data:CommitTransaction
              - rds-data:RollbackTransaction
            Resource: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
          - Sid: ReadDbSecret
            Effect: Allow
            Action: [secretsmanager:GetSecretValue]
            Resource: !GetAtt AuroraCluster.MasterUserSecret.SecretArn

Outputs:
  ClusterArn:
    Value: !Sub arn:aws:rds:${AWS::Region}:${AWS::AccountId}:cluster:${AuroraCluster}
  SecretArn:
    Value: !GetAtt AuroraCluster.MasterUserSecret.SecretArn
  DatabaseName:
    Value: !Ref DatabaseName
  AgentDataAccessPolicyArn:
    Value: !Ref AgentDataAccessPolicy
  # 以下输出留给 Part 2 的 VPC 内 Lambda 使用
  VpcId:
    Value: !Ref WorkshopVpc
  PrivateSubnetIds:
    Value: !Join [",", [!Ref PrivateSubnetA, !Ref PrivateSubnetB]]
  LambdaClientSecurityGroupId:
    Value: !Ref LambdaClientSecurityGroup
  ClusterEndpoint:
    Value: !GetAtt AuroraCluster.Endpoint.Address
